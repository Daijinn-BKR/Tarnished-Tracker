[package]
name = "elden-ring-app"
version = "0.1.0"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
er_core = { path = "../core" }
serde_json = "1"
tauri = { version = "2.12.7", features = ["protocol-asset"] }
